<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">UR Tangram Control project overview</title>
  <desc id="desc">A Pygame tangram editor sends target poses over TCP/IP to a UR5e robot program.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b31"/>
      <stop offset="1" stop-color="#1c3150"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243b5d"/>
      <stop offset="1" stop-color="#1b2d49"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#70d7c2"/>
    </marker>
  </defs>

  <rect width="1200" height="390" rx="26" fill="url(#background)"/>
  <circle cx="1082" cy="36" r="130" fill="#70d7c2" opacity=".06"/>
  <circle cx="132" cy="374" r="170" fill="#ffb454" opacity=".05"/>

  <text x="54" y="55" fill="#70d7c2" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">ROBOT CONTROL PROJECT</text>
  <text x="54" y="88" fill="#f5f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">From a screen layout to robot motion</text>

